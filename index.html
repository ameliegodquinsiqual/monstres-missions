<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monstres &amp; Missions</title>
<meta name="description" content="Les missions des enfants, leurs points, leurs séries de jours et leurs récompenses, partagés entre les téléphones des parents.">
<meta name="theme-color" content="#CFEAFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10173A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Monstres">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Titan+One&display=swap">
<style>
/* Layout: a phone-width sticker book. One centered column, comic ink outlines with hard offset shadows, bottom tab bar. */
:root{
  --sky:#CFEAFF; --sky-dot:#B6DCFA;
  --card:#FFFFFF; --card-2:#EAF4FF; --ink:#1B2240; --ink-2:#56618A; --line:#1B2240;
  --sun:#FFC83A; --flame:#FF6A3D; --leaf:#22B573; --berry:#E8456A; --grape:#7A5CFF;
  --on-color:#1B2240; --scrim:rgba(14,20,48,.5);
  --font-display:"Titan One","Baloo 2",ui-rounded,system-ui,sans-serif;
  --font-body:"Baloo 2",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sh:0 4px 0 var(--line);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#10173A; --sky-dot:#19224D; --card:#222B58; --card-2:#1A2249; --ink:#F2F4FF; --ink-2:#A9B2DC; --line:#050919;
    --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky:#10173A; --sky-dot:#19224D; --card:#222B58; --card-2:#1A2249; --ink:#F2F4FF; --ink-2:#A9B2DC; --line:#050919;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;min-height:100vh;background-color:var(--sky);background-image:radial-gradient(var(--sky-dot) 1.7px,transparent 2.2px);background-size:22px 22px;color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sky)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(112px + env(safe-area-inset-bottom,0px))}
.muted{color:var(--ink-2)}
.c{text-align:center}
.hint{font-size:.88rem;color:var(--ink-2);font-weight:600}

/* icons */
.ic{width:22px;height:22px;display:block;flex:none}
.fl .f-o{fill:var(--flame);stroke:var(--line);stroke-width:1.6;stroke-linejoin:round}
.fl .f-i{fill:var(--sun)}
.off .fl .f-o{fill:var(--card-2)}
.off .fl .f-i{fill:none}
.cn .c-o{fill:var(--sun);stroke:var(--line);stroke-width:1.8}
.cn .c-i{fill:none;stroke:var(--line);stroke-width:1.2;opacity:.45}
.cn .c-s{fill:var(--line);opacity:.7}
.st .s-p{fill:var(--grape);stroke:var(--line);stroke-width:1.6;stroke-linejoin:round}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sky);display:flex;align-items:center;gap:12px;padding-block:12px 10px}
.top-t{flex:1;min-width:0}
.h-fam{font-family:var(--font-display);font-size:1.45rem;line-height:1.1;text-wrap:balance;overflow-wrap:anywhere}
.h-date{font-size:.88rem;color:var(--ink-2);font-weight:700}
.ibtn{width:44px;height:44px;flex:none;border-radius:14px;border:2.5px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line);display:grid;place-items:center;color:var(--ink);padding:0}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.ibtn.on{background:var(--sun);color:var(--on-color)}
.ibtn.sm{width:38px;height:38px;border-radius:12px}
.ibtn:disabled{opacity:.35;box-shadow:none}
.ibtn.ok{background:var(--leaf);color:var(--on-color)}
.ibtn.no{background:var(--card-2)}

.band{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;padding:8px 12px;border:2px solid var(--line);border-radius:14px;background:var(--card);font-weight:700;font-size:.9rem}
.band.parent{background:var(--sun);color:var(--on-color)}
.linkbtn{background:none;border:0;padding:4px 2px;font-weight:800;text-decoration:underline;text-underline-offset:3px;color:inherit}

/* generic */
.card{background:var(--card);border:2.5px solid var(--line);border-radius:22px;box-shadow:var(--sh)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2.5px solid var(--line);border-radius:999px;background:var(--sun);color:var(--on-color);box-shadow:0 4px 0 var(--line);padding:10px 20px;font-weight:800;font-size:1rem;line-height:1.1}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.green{background:var(--leaf);color:var(--on-color)}
.btn.danger{background:var(--berry);color:#fff}
.btn.big{font-size:1.15rem;padding:14px 26px}
.btn.sm{padding:6px 14px;font-size:.9rem;box-shadow:0 3px 0 var(--line)}
.btn:disabled{opacity:.5;box-shadow:none;transform:none}
.btn .ic{width:20px;height:20px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px 2px 5px;border:2px solid var(--line);border-radius:999px;background:var(--card-2);font-weight:800;font-variant-numeric:tabular-nums;font-size:.95rem;line-height:1.5}
.chip .ic{width:20px;height:20px}
.chip.coin{background:var(--sun);color:var(--on-color)}
.chip.flame{background:var(--card)}
.chip.flame.lit{background:var(--flame);color:var(--on-color)}
.chip.flame.risk .ic{animation:flick 1.4s ease-in-out infinite}
.bar{height:14px;border:2px solid var(--line);border-radius:999px;background:var(--card-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--leaf);border-radius:999px}
.sec-t{font-family:var(--font-display);font-size:1.15rem;margin:24px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-t small{font-family:var(--font-body);font-size:.85rem;color:var(--ink-2);font-weight:700}
.stack{display:grid;gap:10px}
.empty{padding:22px 18px;text-align:center;display:grid;gap:10px;justify-items:center}
.empty p{color:var(--ink-2);font-weight:600;max-width:34ch}

/* monsters */
.mon{display:block;overflow:visible;animation:bob 3.2s ease-in-out infinite;transform-origin:50% 90%}
.mon.still{animation:none}
.mon.jump{animation:jump .9s cubic-bezier(.3,1.6,.5,1) infinite}
.locked .mon{filter:grayscale(1);opacity:.32;animation:none}

/* home */
.kids{display:grid;gap:14px}
.kid-card{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;padding:12px 14px 12px 12px;text-align:left;width:100%;color:var(--ink)}
.kid-card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.kc-av{display:grid;place-items:center;width:96px;height:96px;border-radius:20px;border:2.5px solid var(--line);background:var(--card-2);background:color-mix(in srgb,var(--kc) 28%,var(--card))}
.kc-body{display:grid;gap:6px;min-width:0}
.kc-name{font-family:var(--font-display);font-size:1.45rem;line-height:1.05;overflow-wrap:anywhere}
.kc-lvl{font-size:.85rem;font-weight:700;color:var(--ink-2)}
.kc-stats{display:flex;flex-wrap:wrap;gap:6px}
.kc-prog{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums}
.kc-prog .bar>i{background:var(--kc)}
.pend{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin-bottom:14px;text-align:left;background:var(--sun);color:var(--on-color);font-weight:800}
.pend .ic{width:26px;height:26px}
.tip{margin:16px 4px 0;font-size:.9rem;color:var(--ink-2);font-weight:600;text-align:center}

/* kid page */
.hero{padding:14px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;background:var(--card);background:color-mix(in srgb,var(--kc) 22%,var(--card))}
.hero-av{grid-row:span 2;display:grid;place-items:center}
.hero-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stat{display:grid;justify-items:center;gap:0;padding:6px 2px;border:2px solid var(--line);border-radius:14px;background:var(--card);text-align:center}
.stat b{font-family:var(--font-display);font-size:1.35rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{font-size:.72rem;font-weight:700;color:var(--ink-2);line-height:1.1}
.stat .ic{width:22px;height:22px}
.xp{display:grid;gap:3px}
.xp small{font-size:.78rem;font-weight:700;color:var(--ink-2)}
.xp .bar>i{background:var(--grape)}
.pending-note{grid-column:1/-1;font-size:.85rem;font-weight:700;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.pending-note .ic{width:18px;height:18px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;margin-top:16px;background:var(--card);border:2.5px solid var(--line);border-radius:18px;box-shadow:0 3px 0 var(--line)}
.tab{border:0;background:none;padding:9px 2px;border-radius:13px;font-weight:800;font-size:.9rem;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--kc,var(--sun));color:var(--on-color);box-shadow:inset 0 0 0 2px var(--line)}
.dnav{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin:18px 0 12px}
.dn-t{text-align:center;display:grid}
.dn-t b{font-family:var(--font-display);font-size:1.2rem;font-weight:400}
.dn-t small{font-weight:700;color:var(--ink-2);font-size:.85rem}
.prog{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;padding:12px 14px;margin-bottom:14px}
.prog b{font-family:var(--font-display);font-weight:400;font-size:1.15rem;display:block;line-height:1.15}
.prog small{font-weight:700;color:var(--ink-2);font-size:.9rem;display:block;margin-top:2px}
.prog.perfect{background:var(--sun);color:var(--on-color)}
.prog.perfect small{color:var(--on-color);opacity:.8}
.ring .rg-t{fill:none;stroke:var(--card-2);stroke-width:12}
.ring .rg-p{fill:none;stroke-width:12}
.ring .rg-o{fill:none;stroke:var(--line);stroke-width:2.2}
.ring .rg-x{font-family:var(--font-display);fill:var(--ink)}
.prog.perfect .ring .rg-x{fill:var(--on-color)}
.task{display:grid;grid-template-columns:54px minmax(0,1fr) 46px;gap:12px;align-items:center;width:100%;padding:10px 12px;text-align:left;background:var(--card);border:2.5px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--line);color:var(--ink);transition:transform .08s ease}
.task:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.t-ico{font-size:30px;width:54px;height:54px;display:grid;place-items:center;border-radius:16px;background:var(--card-2);border:2px solid var(--line);line-height:1}
.t-title{font-weight:800;font-size:1.07rem;line-height:1.15;display:block;overflow-wrap:anywhere}
.t-meta{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--ink-2);font-weight:700;margin-top:3px}
.t-meta .ic{width:16px;height:16px}
.t-check{width:44px;height:44px;border-radius:50%;border:2.5px dashed var(--ink-2);display:grid;place-items:center;color:var(--on-color)}
.t-check .ic{width:24px;height:24px}
.task.st-wait .t-check{border:2.5px solid var(--line);background:var(--sun)}
.task.st-ok{background:var(--card);background:color-mix(in srgb,var(--leaf) 18%,var(--card))}
.task.st-ok .t-check{border:2.5px solid var(--line);background:var(--leaf)}
.task.st-ok .t-ico{background:var(--card)}
.past-note{margin:0 0 12px;font-size:.88rem;font-weight:700;color:var(--ink-2);text-align:center}
.beh{display:flex;flex-wrap:wrap;gap:8px}
.bchip{display:inline-flex;align-items:center;gap:6px;padding:7px 8px 7px 12px;border-radius:999px;border:2.5px solid var(--line);background:var(--card);font-weight:800;box-shadow:0 3px 0 var(--line);font-size:.95rem;color:var(--ink)}
.bchip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.bchip .v{padding:0 8px;border-radius:999px;border:2px solid var(--line);font-size:.85rem;color:var(--on-color);font-variant-numeric:tabular-nums}
.bchip .v.pos{background:var(--leaf)}
.bchip .v.neg{background:var(--berry);color:#fff}
.bchip.ghost{padding-right:12px;background:var(--card-2)}
.bchip .ic{width:18px;height:18px}
.je{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 10px 8px 12px;background:var(--card);border:2px solid var(--line);border-radius:14px}
.je .e-ico{font-size:22px;text-align:center;line-height:1}
.je b{font-weight:700;overflow-wrap:anywhere;line-height:1.2}
.je small{display:block;color:var(--ink-2);font-weight:600;font-size:.8rem}
.pts{font-family:var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.pts.pos{color:var(--leaf)}
.pts.neg{color:var(--berry)}
.x-btn{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--card-2);display:grid;place-items:center;padding:0;color:var(--ink)}
.x-btn .ic{width:16px;height:16px}
.jd{font-weight:800;font-size:.85rem;color:var(--ink-2);margin:12px 4px 2px;text-transform:capitalize}

/* shop */
.wallet{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:14px 16px;margin-top:18px;background:var(--sun);color:var(--on-color)}
.wallet .ic{width:52px;height:52px}
.wallet b{font-family:var(--font-display);font-weight:400;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums;display:block}
.wallet small{font-weight:700;font-size:.9rem}
.rw{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px}
.rw-ico{font-size:30px;width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:var(--card-2);border:2px solid var(--line)}
.rw b{display:block;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.rw small{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--ink-2);font-size:.85rem;margin:2px 0 5px}
.rw small .ic{width:16px;height:16px}
.rw .bar{height:10px}
.rw .bar>i{background:var(--sun)}

/* badges */
.lvl-card{padding:16px;display:grid;justify-items:center;gap:8px;text-align:center;margin-top:18px;background:var(--card);background:color-mix(in srgb,var(--kc) 20%,var(--card))}
.lvl-card h3{font-family:var(--font-display);font-weight:400;font-size:1.4rem}
.lvl-card .bar{width:100%}
.lvl-card .bar>i{background:var(--grape)}
.lvl-card p{font-weight:700;color:var(--ink-2);font-size:.9rem}
.road{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory}
.road>div{flex:none;display:grid;justify-items:center;gap:2px;width:76px;padding:6px 4px;border:2px solid var(--line);border-radius:16px;background:var(--card);scroll-snap-align:start}
.road>div.cur{background:var(--sun);color:var(--on-color)}
.road small{font-weight:800;font-size:.75rem}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bdg{display:grid;justify-items:center;gap:6px;padding:12px 6px 10px;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:18px}
.b-ico{width:60px;height:60px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;font-size:28px;background:var(--sun);box-shadow:0 3px 0 var(--line);transform:rotate(var(--tilt,0deg));line-height:1}
.bdg b{font-size:.85rem;line-height:1.1;font-weight:800}
.bdg small{font-size:.74rem;color:var(--ink-2);font-weight:700;line-height:1.1}
.bdg.off .b-ico{background:var(--card-2);filter:grayscale(1);opacity:.5;box-shadow:none}
.bdg.off b{color:var(--ink-2)}
.mini-bar{width:80%;height:7px;border:1.5px solid var(--line);border-radius:999px;background:var(--card-2);overflow:hidden}
.mini-bar>i{display:block;height:100%;background:var(--grape)}

/* history */
.stats4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.s4{padding:10px 12px;border:2px solid var(--line);border-radius:16px;background:var(--card)}
.s4 b{font-family:var(--font-display);font-weight:400;font-size:1.5rem;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.s4 small{font-weight:700;color:var(--ink-2);font-size:.82rem}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dc{border-radius:12px;border:2px solid var(--line);display:grid;justify-items:center;padding:4px 0;background:var(--card);line-height:1.1}
.dc small{font-size:.7rem;font-weight:800;color:var(--ink-2)}
.dc b{font-size:.95rem;font-weight:800;font-variant-numeric:tabular-nums}
.dc.st-perfect{background:var(--flame);color:var(--on-color)}
.dc.st-perfect small{color:var(--on-color)}
.dc.st-partial{background:linear-gradient(0deg,var(--sun) 50%,var(--card) 50%)}
.dc.st-missed{background:var(--card-2);opacity:.75}
.dc.st-rest,.dc.st-none{border-style:dashed;background:transparent}
.dc.st-none{opacity:.4}
.dc.today{box-shadow:0 0 0 3px var(--grape)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:.8rem;font-weight:700;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-radius:4px;vertical-align:-1px;margin-right:4px}
.chart-wrap{padding:12px 10px 6px;margin-top:4px}
.chart{width:100%;height:auto;display:block}
.chart .bp{fill:var(--leaf);stroke:var(--line);stroke-width:1.5}
.chart .bn{fill:var(--berry);stroke:var(--line);stroke-width:1.5}
.chart .base{stroke:var(--line);stroke-width:2}
.chart .grid{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 4;opacity:.5}
.chart text{fill:var(--ink-2);font-family:var(--font-body);font-weight:700;font-size:10px}
.chart text.v{fill:var(--ink);font-size:9.5px}
.chart text.td{fill:var(--ink);font-weight:800}

/* parents */
.lockcard{padding:22px 18px;display:grid;justify-items:center;gap:12px;text-align:center;margin-top:8px}
.lockcard h2{font-family:var(--font-display);font-weight:400;font-size:1.5rem}
.lockcard p{color:var(--ink-2);font-weight:600;max-width:34ch}
.ptabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 6px;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptab{flex:none;padding:7px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:.92rem;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.ptab[aria-selected="true"]{background:var(--ink);color:var(--card)}
.ptab .dot{min-width:20px;height:20px;font-size:.75rem}
.dot{min-width:22px;height:22px;border-radius:11px;background:var(--berry);color:#fff;font-size:.8rem;font-weight:800;display:inline-grid;place-items:center;padding:0 6px;border:2px solid var(--line);line-height:1}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;background:var(--card);border:2.5px solid var(--line);border-radius:18px;width:100%;text-align:left;color:var(--ink)}
button.row:active{transform:translateY(2px)}

  vals.forEach((v, i) => {

    if (v) s += `<rect class="${v >= 0 ? 'bp' : 'bn'}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(hgt, 2).toFixed(1)}" rx="4"/><text class="v" x="${(x + w / 2).toFixed(1)}" y="${(v >= 0 ? y - 3 : y + hgt + 10).toFixed(1)}" text-anchor="middle">${v}</text>`;
    const dt = parseDay(days[i]);
    s += `<text class="${days[i] === today ? 'td' : ''}" x="${(x + w / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${DOW[dt.getDay()]}</text>`;
  });
  s += `<line class="base" x1="0" x2="${W}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}"/></svg>`;
  return s;
}

async function obFinish() {
  const o = UI.onboard; if (o.saving) return;
  o.saving = true; o.err = ''; render();
  const now = Date.now(), today = todayStr(), w = [];
  w.push(Store.write('config', 'main', 'set', { familyName: o.family.trim() || 'Ma famille', pin: /^\d{4}$/.test(o.pin) ? o.pin : '', validation: true, streakPerDay: 1, streakCap: 10, createdAt: now }));
  o.kids.forEach((k, i) => w.push(Store.write('kids', uid('k'), 'set', { name: k.name, color: k.color, variant: k.variant, createdAt: now + i })));
  PRESET_TASKS.forEach((t, i) => { if (o.tasks[i]) w.push(Store.write('tasks', uid('t'), 'set', { icon: t[0], title: t[1], points: t[2], sched: [{ from: today, kids: [], days: t[3] }], createdAt: now + i })); });
  PRESET_REWARDS.forEach((r, i) => { if (o.rewards[i]) w.push(Store.write('rewards', uid('r'), 'set', { icon: r[0], title: r[1], cost: r[2], createdAt: now + i })); });
  PRESET_BEH.forEach((r, i) => { if (o.behs[i]) w.push(Store.write('behaviors', uid('c'), 'set', { icon: r[0], label: r[1], points: r[2], createdAt: now + i })); });
  const res = await Promise.all(w);
  if (res.every(Boolean)) { UI.onboard = null; UI.view = 'home'; UI.justCreated = false; Parent.unlock(); sound('perfect'); rain(80); toast('Bienvenue dans la tribu !'); }
  else { o.saving = false; o.err = "Une partie n'a pas pu être enregistrée. Réessayez."; }
  render();
}

/* ---------- render ---------- */
function render() {
  const app = $('#app'), nav = $('#nav');
  nav.hidden = true;
  if (UI.offline) { app.innerHTML = viewMsg('Pas de connexion', "La première ouverture a besoin d'internet. Vérifiez la connexion puis réessayez.", true); return; }
  if (UI.fbError) { app.innerHTML = viewMsg('Souci de connexion', UI.fbError, true); return; }
  if (UI.welcome) { app.innerHTML = viewWelcome(); return; }
  if (!UI.loaded) { app.innerHTML = viewLoading(); return; }
  const empty = !S.config && !Object.keys(S.kids).length;
  if (empty) {
    if (UI.mode === 'cloud' && !UI.cfgServer && !UI.justCreated) { app.innerHTML = viewLoading(); return; }
    if (!UI.onboard) UI.onboard = newOnboard();
    app.innerHTML = (UI.mode === 'local' ? `<div style="padding-top:12px">${bands()}</div>` : '') + viewOnboard();
    return;
  }
  UI.onboard = null;
  let html;
  if (UI.view === 'kid' && S.kids[UI.kidId]) html = viewKid();
  else if (UI.view === 'parents') html = viewParents();
  else { UI.view = 'home'; html = viewHome(); }
  app.innerHTML = html;
  const pend = pendingList().length;

function pinKey(k) {

/* ---------- actions ---------- */
function curKid() { return S.kids[UI.kidId] ? { id: UI.kidId, ...S.kids[UI.kidId] } : null; }
function centerOf(el) { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, r }; }
async function toggleTask(el) {
  if (UI.readOnly) return toast('Accès en lecture seule : modification impossible.');
  const kid = curKid(), tid = el.dataset.tid, t = S.tasks[tid]; if (!kid || !t) return;
  const d = UI.date, past = d < todayStr();
  const cur = dayRec(kid.id, d).done?.[tid];
  const pos = centerOf(el);
  const run = async () => {
    const before = computeKid(kid);
    const parent = Parent.isOn();
    let next;
    if (!cur) next = (parent || (S.config && S.config.validation === false)) ? 'ok' : 'wait';
    else if (cur.s === 'wait') next = parent ? 'ok' : null;
    else next = null;
    if (next && !(cur && cur.s === 'wait' && next === 'ok')) { burst(pos.r.right - 30, pos.y, 26, kid.color); floatText(pos.r.right - 40, pos.y - 10, `+${t.points}`); sound('tick'); }
    else if (next === 'ok') { burst(pos.r.right - 30, pos.y, 16, kid.color); sound('tick'); }
    else sound('undo');
    const entry = next ? { s: next, p: cur ? cur.p : (Number(t.points) || 0), at: cur ? cur.at : Date.now(), t: t.title, i: t.icon || '⭐' } : null;
    const ok = await patchDay(kid.id, d, { done: { [tid]: entry } });
    if (!ok) return;
    await sleep(60);
    celebrateDiff(kid, before, computeKid(kid), d);
  };
  if (past || (cur && cur.s === 'ok')) return ensureParent(run, past ? 'Modifier un jour passé' : 'Décocher une mission validée');
  run();
}
async function addBeh(kid, d, b, pos) {
  const before = computeKid(kid);
  if (pos) { if (b.points > 0) burst(pos.x, pos.y, 22, kid.color); floatText(pos.x, pos.y - 16, `${b.points > 0 ? '+' : ''}${b.points}`, b.points < 0); }
  sound(b.points > 0 ? 'tick' : 'minus');
  const ok = await patchDay(kid.id, d, { beh: { [uid('e')]: { l: b.label, i: b.icon || '⭐', p: b.points, at: Date.now() } } });
  if (!ok) return;
  await sleep(60);
  toast(`${b.points > 0 ? '+' : ''}${b.points} pts pour ${kid.name} : ${b.label}`);
  celebrateDiff(kid, before, computeKid(kid), d);
}

  },
  'pick-many'(el) {
    const st = SH.st; if (!st) return; const key = el.dataset.key, raw = el.dataset.v, num = el.dataset.num === '1';
    let arr = st[key] || [];
    if (raw === '*') arr = [];
    else { const v = num ? +raw : raw; arr = arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v]; }
    st[key] = arr;
    const g = el.closest('[data-group]'); updatePressed(g, b => b.dataset.v === '*' ? !arr.length : arr.includes(num ? +b.dataset.v : b.dataset.v));
  },
  'days-preset'(el) { const st = SH.st; if (!st) return; st.days = el.dataset.v.split(',').map(Number); const g = $('[data-group="days"]'); updatePressed(g, b => st.days.includes(+b.dataset.v)); },
  'step'(el) { const st = SH.st; if (!st) return; const k = el.dataset.key; let v = clamp((st[k] || 0) + Number(el.dataset.d), Number(el.dataset.min), Number(el.dataset.max)); if (k === 'bpoints' && v === 0) v = Number(el.dataset.d) > 0 ? 1 : -1; st[k] = v; const o = $('#out-' + k); if (o) o.textContent = (k === 'bpoints' && v > 0 ? '+' : '') + v; },
  async 'kid-del'(el) {
    const st = SH.st; if (!st || !st.id) return;
    if (!st.confirm) { st.confirm = true; el.textContent = 'Confirmer : tout son historique sera effacé'; return; }
    const id = st.id; closeSheet();
    const mids = Object.keys(S.months).filter(m => S.months[m] && S.months[m].kidId === id);
    await Store.write('kids', id, 'del');
    await Promise.all(mids.map(m => Store.write('months', m, 'del')));
    if (UI.kidId === id) UI.view = UI.view === 'kid' ? 'home' : UI.view;
    toast('Enfant supprimé.'); render();
  },
  async 'task-del'(el) { const st = SH.st; if (!st || !st.id) return; if (!st.confirm) { st.confirm = true; el.textContent = 'Confirmer la suppression'; return; } const id = st.id; closeSheet(); if (await Store.write('tasks', id, 'update', { archivedAt: Date.now() })) toast("Mission supprimée. L'historique est conservé."); },
  async 'reward-del'(el) { const st = SH.st; if (!st || !st.id) return; if (!st.confirm) { st.confirm = true; el.textContent = 'Confirmer la suppression'; return; } const id = st.id; closeSheet(); if (await Store.write('rewards', id, 'del')) toast('Récompense supprimée.'); },
  async 'beh-preset-del'(el) { const st = SH.st; if (!st || !st.id) return; if (!st.confirm) { st.confirm = true; el.textContent = 'Confirmer la suppression'; return; } const id = st.id; closeSheet(); if (await Store.write('behaviors', id, 'del')) toast('Comportement supprimé.'); },
  'fam-create'() { const fid = Family.make(); Family.set(fid); UI.justCreated = true; Store.connect(fid); },
  'fam-join'() { const fid = Family.parse(UI.joinCode || ($('#join-code') || {}).value); if (!fid) { UI.joinErr = 'Code incomplet. Il ressemble à abcde-fghjk-mnpqr-stuvw.'; return render(); } joinFamily(fid); },
  'paste-code'() { navigator.clipboard.readText().then(t => { const f = Family.parse(t); if (f) { UI.joinCode = f; UI.joinErr = ''; render(); } else toast('Aucun code famille dans le presse-papiers.'); }).catch(() => toast('Collez le code dans le champ.')); },
  'switch-confirm'() { const st = SH.st; closeSheet(); if (st && st.fid) joinFamily(st.fid, true); },
  'fam-phone'() { openPhoneSheet(); },
  'copy-link'() { copyText(Family.link(Family.get())); },
  'share-link'() { navigator.share({ title: 'Monstres & Missions', text: 'Rejoins notre famille sur Monstres & Missions', url: Family.link(Family.get()) }).catch(() => {}); },
  'fam-leave'(el) {
    if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'Confirmer'; return; }
    Family.clear(); Store.disconnect();
    for (const k of COLS) S[k] = {};
    S.config = null; CK.clear(); Parent.lock();
    Object.assign(UI, { welcome: true, view: 'home', onboard: null, justCreated: false });
    render(); scrollTo(0, 0); toast('Ce téléphone a quitté la famille. Les données restent en ligne.');
  },
  'reload'() { location.reload(); },
  /* onboarding */
  'ob-next'() {
    const o = UI.onboard; o.err = '';
    if (o.step === 1 && o.pin && !/^\d{4}$/.test(o.pin)) { o.err = 'Le code doit faire exactement 4 chiffres (ou laissez vide).'; return render(); }
    if (o.step === 2) { if (o.kname.trim()) A['ob-add-kid'](); if (!o.kids.length) { o.err = 'Ajoutez au moins un enfant.'; return render(); } }
    o.step = Math.min(4, o.step + 1); render(); scrollTo(0, 0);
  },
  'ob-back'() { const o = UI.onboard; o.err = ''; o.step = Math.max(1, o.step - 1); render(); scrollTo(0, 0); },
  'ob-add-kid'() {
    const o = UI.onboard, name = o.kname.trim(); if (!name) { o.err = 'Écrivez un prénom.'; return render(); }
    o.kids.push({ name, color: o.kcolor, variant: o.kvar }); o.kname = ''; o.err = '';
    const used = new Set(o.kids.map(k => k.color)); o.kcolor = KID_COLORS.find(c => !used.has(c)) || KID_COLORS[o.kids.length % KID_COLORS.length]; o.kvar = (o.kvar + 1) % 4;
    render();
  },
  'ob-del-kid'(el) { UI.onboard.kids.splice(+el.dataset.i, 1); render(); },
  'ob-toggle'(el) { const o = UI.onboard, k = el.dataset.k, i = +el.dataset.i; o[k][i] = !o[k][i]; el.setAttribute('aria-pressed', String(o[k][i])); el.querySelector('.oi-c').innerHTML = o[k][i] ? I.check : ''; },
  'ob-finish'() { obFinish(); }
};

const FORMS = {
  async kid(f) {
    const st = SH.st, name = f.name.value.trim(); if (!name) return;
    const data = { name, color: st.color, variant: st.variant };
    const id = st.id; closeSheet();
    const ok = id ? await Store.write('kids', id, 'update', data) : await Store.write('kids', uid('k'), 'set', { ...data, createdAt: Date.now() });
    if (ok) toast(id ? 'Enregistré.' : `${name} rejoint la tribu !`);
  },
  async task(f) {
    const st = SH.st, title = f.title.value.trim(); if (!title) return;
    if (!st.days.length) { const e = $('#form-err'); e.textContent = 'Choisissez au moins un jour.'; e.hidden = false; return; }
    const today = todayStr();
    const rule = { kids: [...st.kids], days: st.days.length === 7 ? [] : [...st.days].sort((a, b) => a - b) };
    const base = { icon: st.icon, title, points: st.points };
    const id = st.id; closeSheet();
    let ok;
    if (!id) ok = await Store.write('tasks', uid('t'), 'set', { ...base, sched: [{ from: today, ...rule }], createdAt: Date.now() });
    else {
      const t = S.tasks[id], lr = lastRule(t);
      const same = JSON.stringify([...(lr.kids || [])].sort()) === JSON.stringify([...rule.kids].sort()) && JSON.stringify(lr.days || []) === JSON.stringify(rule.days);
      const patch = { ...base };
      if (!same) { const prev = (Array.isArray(t.sched) && t.sched.length) ? t.sched : [{ from: dayStr(new Date(t.createdAt || Date.now())), kids: t.kids || [], days: t.days || [] }]; patch.sched = prev.filter(e => e.from < today).concat([{ from: today, ...rule }]); }
      ok = await Store.write('tasks', id, 'update', patch);
    }
    if (ok) toast(id ? 'Mission enregistrée.' : `Nouvelle mission : ${title}`);
  },
  async reward(f) {
    const st = SH.st, title = f.title.value.trim(); if (!title) return;
    const data = { icon: st.icon, title, cost: st.cost }, id = st.id; closeSheet();
    const ok = id ? await Store.write('rewards', id, 'update', data) : await Store.write('rewards', uid('r'), 'set', { ...data, createdAt: Date.now() });
    if (ok) toast(id ? 'Récompense enregistrée.' : `Nouvelle récompense : ${title}`);
  },
  async beh(f) {
    const st = SH.st, label = f.label.value.trim(); if (!label) return;
    const data = { icon: st.icon, label, points: st.bpoints || 1 }, id = st.id; closeSheet();
    const ok = id ? await Store.write('behaviors', id, 'update', data) : await Store.write('behaviors', uid('c'), 'set', { ...data, createdAt: Date.now() });
    if (ok) toast('Comportement enregistré.');
  },
  cbeh(f) {
    const st = SH.st, label = f.label.value.trim(); if (!label) return;
    const kid = S.kids[st.kidId] ? { id: st.kidId, ...S.kids[st.kidId] } : null; if (!kid) return closeSheet();
    const b = { icon: st.icon, label, points: st.bpoints || 1 }; closeSheet();
    addBeh(kid, UI.date, b, { x: innerWidth / 2, y: innerHeight / 2 });
  },
  async family(f) { const v = f.family.value.trim(); if (!v) return; closeSheet(); if (await saveConfig({ familyName: v })) toast('Nom enregistré.'); }
};

document.addEventListener('click', e => {
  const scrim = e.target.closest('[data-scrim]');
  if (scrim && e.target === scrim) return closeSheet();
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); const fn = FORMS[f.dataset.form]; if (fn) fn(f); });
document.addEventListener('input', e => {
  if (e.target.id === 'join-code') { UI.joinCode = e.target.value; return; }
  const el = e.target; if (!el.dataset || !el.dataset.ob || !UI.onboard) return;
  let v = el.value; if (el.dataset.ob === 'pin') { v = v.replace(/\D/g, '').slice(0, 4); if (v !== el.value) el.value = v; }
  UI.onboard[el.dataset.ob] = v;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#fx-root').innerHTML) $('#fx-root').innerHTML = ''; else closeSheet(); return; }
  if (SH.st && SH.st.type === 'pin') { if (/^\d$/.test(e.key)) pinKey(e.key); else if (e.key === 'Backspace') pinKey('del'); }
  if (e.key === 'Enter' && e.target.id === 'ob-kname') { e.preventDefault(); A['ob-add-kid'](); setTimeout(() => { const i = $('#ob-kname'); if (i) i.focus(); }, 30); }
});
let wasOn = Parent.isOn(), lastDay = todayStr();
setInterval(() => {
  const on = Parent.isOn(), d = todayStr();
  if (on !== wasOn || d !== lastDay) { if (d !== lastDay && UI.date === lastDay) UI.date = d; wasOn = on; lastDay = d; CK.clear(); render(); }
}, 15000);
addEventListener('resize', () => { if (FX.running) fxCanvas(); });

const hashFid = Family.parse(decodeURIComponent(location.hash || ''));
if (hashFid) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
render();
Store.init(hashFid);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
